name: Publish portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: AlanWYChen/AlanWYChen.github.io/.github/workflows/deploy-alanwychen.yml@main
    with:
      app-path: apps/portfolio
    secrets:
      COMPOSITE_DEPLOY_KEY: ${{ secrets.COMPOSITE_DEPLOY_KEY }}
